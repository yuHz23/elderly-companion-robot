name: Auto Sync & CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "=== Project Structure ==="
          find . -type f -not -path './.git/*' | sort
          echo ""
          echo "=== File count ==="
          find . -type f -not -path './.git/*' | wc -l

      - name: Validate README exists
        run: |
          test -f README.md && echo "README.md OK" || echo "README.md MISSING"

      - name: Check for secrets in repo
        run: |
          echo "Scanning for potential secrets..."
          SECRETS_FOUND=0
          for f in $(find . -type f -not -path './.git/*' -name "*.h" -o -name "*.env" -o -name "*.cfg"); do
            if grep -lE "(password|secret|api_key|token|WIFI_PASS)" "$f" 2>/dev/null; then
              echo "WARNING: Potential secret in $f"
              SECRETS_FOUND=1
            fi
          done
          if [ $SECRETS_FOUND -eq 1 ]; then
            echo "::warning::Potential secrets found — verify before deploying"
          else
            echo "No obvious secrets detected"
          fi

  firmware-build:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up PlatformIO
        if: hashFiles('firmware/platformio.ini') != ''
        uses: platformio/action-setup@v2

      - name: Build firmware
        if: hashFiles('firmware/platformio.ini') != ''
        working-directory: firmware
        run: |
          pio run || echo "PlatformIO build not yet configured — skipping"

  kicad-check:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4

      - name: Check KiCad files exist
        run: |
          if find hardware/kicad -name "*.kicad_sch" -o -name "*.kicad_pcb" 2>/dev/null | grep -q .; then
            echo "KiCad files detected"
          else
            echo "No KiCad files yet — will be added in hardware phase"
          fi

  docs-update:
    runs-on: ubuntu-latest
    needs: [build-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Generate project stats
        run: |
          echo "=== Project Stats ==="
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Files: $(find . -type f -not -path './.git/*' | wc -l)"

      - name: Commit stats update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes to commit" || git add -A && git commit -m "chore: auto-update project stats" && git push