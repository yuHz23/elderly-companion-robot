; PlatformIO Project Configuration — Elderly Companion Robot
; ============================================================
; Target: ESP32-S3-CAM N16R8 (16MB flash, 8MB Octal PSRAM, OV3660 DVP)
; Framework: ESP-IDF v5 (not Arduino — we want RTOS task control)

[platformio]
default_envs = esp32-s3-cam
src_dir = main
boards_dir = boards

[env:esp32-s3-cam]
platform = espressif32@^6.6.0
board = esp32-s3-cam-n16r8
framework = espidf

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
upload_protocol = esptool

; Wait long enough for the ESP32-S3 USB-CDC to enumerate after reset
monitor_rts = 0
monitor_dtr = 0

; Build flags
build_flags =
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_USE_MALLOC=1
  -Wall
  -Wno-unused-variable
  -DLOG_LOCAL_LEVEL=ESP_LOG_INFO

; Custom partition table — 16MB flash
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; PSRAM 8MB Octal — must match N16R8 module
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; Embed Wi-Fi credentials at compile time only as fallback
; (real creds come from NVS via wifi_manager)
build_src_filter = +<*>

; Library dependencies — minimal for Phase 3 (camera + WiFi)
lib_deps =
  espressif/esp32-camera@^2.0.4

; sdkconfig overrides applied on top of board default
extra_scripts = post:scripts/post_build.py
